<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso – Sistema de Pedidos</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginScreen" class="login-overlay">
        <div class="login-card">
            <span class="material-icons">inventory_2</span>
            <h2>PEDIDOS</h2>
            <p>Ingrese sus credenciales</p>
            <input type="text" id="username" class="login-input" placeholder="Usuario" autocomplete="username">
            <input type="password" id="password" class="login-input" placeholder="Contraseña" autocomplete="current-password">
            <div class="remember-row">
                <label>
                    <input type="checkbox" id="rememberMe"> Recordar contraseña
                </label>
            </div>
            <button class="login-btn" id="loginBtn">Iniciar sesión</button>
            <div class="error-msg" id="loginError">Usuario o contraseña incorrectos</div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.getElementById('loginBtn').addEventListener('click', () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;
            if (login(user, pass, remember)) {
                window.location.href = 'proveedores.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        if (sessionStorage.getItem('currentUser')) {
            window.location.href = 'proveedores.html';
        }
    </script>
</body>
</html>
